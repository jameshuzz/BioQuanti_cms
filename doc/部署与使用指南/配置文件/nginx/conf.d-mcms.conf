# ============================================================
# BioQuanti 多域名配置（2026-10-10）
# zh.bioquanti.com  -> 中文站（HTTPS）
# bioquanti.com     -> 英文站（HTTPS）
# www.bioquanti.com -> 301 到中文站（无证书，仅HTTP跳转）
# IP / 其他         -> 直接出页面，不跳转
# URL 短链：/html/web/{cn|en}/ 前缀由 sub_filter 替换为 /，
#          域名根路径直接映射对应语言静态目录，旧长URL仍兼容
# ============================================================

# ---------- HTTP 80：域名跳 HTTPS（SEO 验证文件放行） ----------

server {
    listen 80;
    server_name zh.bioquanti.com;
    location /baidu_verify_ { root /opt/mcms/seo; }
    location = /robots.txt  { alias /opt/mcms/seo/robots.txt; }
    location = /sitemap.xml { alias /opt/mcms/seo/sitemap.xml; }
    location / { return 301 https://zh.bioquanti.com$request_uri; }
}

server {
    listen 80;
    server_name bioquanti.com;
    location /baidu_verify_ { root /opt/mcms/seo; }
    location = /robots.txt  { alias /opt/mcms/seo/robots.txt; }
    location = /sitemap.xml { alias /opt/mcms/seo/sitemap.xml; }
    location / { return 301 https://bioquanti.com$request_uri; }
}

server {
    listen 80;
    server_name www.bioquanti.com;
    location /baidu_verify_ { root /opt/mcms/seo; }
    location = /robots.txt  { alias /opt/mcms/seo/robots.txt; }
    location = /sitemap.xml { alias /opt/mcms/seo/sitemap.xml; }
    # www 无证书：直接301到中文站HTTPS
    location / { return 301 https://zh.bioquanti.com$request_uri; }
}

# ---------- IP / 未知 host：直接出页面（中文内容），不跳转 ----------

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 1000m;
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 短链替换：中文
    sub_filter '/html/web/cn/' '/';
    sub_filter_once off;
    sub_filter_last_modified on;
    sub_filter_types application/javascript;

    # 静态资源
    location /html/     { alias /opt/mcms/html/; }
    location /template/ { alias /opt/mcms/template/; }
    location /upload/   { alias /opt/mcms/upload/; }
    location /static/   { alias /opt/mcms/static/; }

    # SEO
    location = /robots.txt  { alias /opt/mcms/seo/robots.txt; }
    location = /sitemap.xml { alias /opt/mcms/seo/sitemap.xml; }
    location /baidu_verify_ { root /opt/mcms/seo; }

    # IP根路径：站内直出中文首页（URL保持/，不跳域名）
    location = / {
        rewrite ^ /html/web/cn/index.html last;
    }

    # 短URL映射中文静态目录，缺失回落后端
    location / {
        root /opt/mcms/html/web/cn;
        try_files $uri $uri/ @backend;
    }

    # 动态请求
    location @backend {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- 中文站 zh.bioquanti.com ----------
server {
    listen 443 ssl http2;
    server_name zh.bioquanti.com;

    ssl_certificate     /etc/nginx/cert/zh.bioquanti.com_bundle.crt;
    ssl_certificate_key /etc/nginx/cert/zh.bioquanti.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1000m;
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 短链替换：中文
    sub_filter '/html/web/cn/' '/';
    sub_filter_once off;
    sub_filter_last_modified on;
    sub_filter_types application/javascript;

    # 静态资源
    location /html/     { alias /opt/mcms/html/; }
    location /template/ { alias /opt/mcms/template/; }
    location /upload/   { alias /opt/mcms/upload/; }
    location /static/   { alias /opt/mcms/static/; }

    # SEO
    location = /robots.txt  { alias /opt/mcms/seo/robots.txt; }
    location = /sitemap.xml { alias /opt/mcms/seo/sitemap.xml; }
    location /baidu_verify_ { root /opt/mcms/seo; }

    # /index.html 归一化
    location = /index.html { return 301 $scheme://$host/; }

    # 中文站根 -> 中文首页（内部重写，URL保持/）
    location = / {
        rewrite ^ /html/web/cn/index.html last;
    }

    # 短URL映射中文静态目录，缺失回落后端
    location / {
        root /opt/mcms/html/web/cn;
        try_files $uri $uri/ @backend;
    }

    # 动态请求
    location @backend {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

