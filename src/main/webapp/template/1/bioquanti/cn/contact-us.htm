<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{ms:global.name/}-联系我们</title>
<meta name="keywords" content="{ms:global.keyword/}">
<meta name="description" content="{ms:global.descrip/}">
<link rel="stylesheet" href="${base}/{ms:global.style/}cn/css/app.css">
<script src="${base}/static/plugins/jquery/3.6.3/jquery-3.6.3.min.js"></script>
</head>
<body>
<#include "/cn/header.htm"/>

<div class="bq2-crumbbar">
    <div class="bq2-container">您当前位置 - <a href="{ms:global.html/}cn/index.html">首页</a> &gt; 联系我们</div>
</div>

<div class="bq2-container bq2-contactwrap">
    <!-- 信息 + 地图 -->
    <div class="bq2-contactbox">
        <div class="info">
            <h3>联系方式：</h3>
            <p class="big">400-111-1200</p>
            <p class="big">WUHAN@BIOQUANTI.CN</p>
            <h3>技术问题，请联系：</h3>
            <p class="big">TECH@BIOQUANTI.CN</p>
            <p>销售电话（微信同号）：18627880041</p>
            <p>技术支持电话（微信同号）：15988423858</p>
            <p class="addr">湖北省武汉市东湖新技术开发区九峰街道高新大道大悦城商务项目1期4号商业5号办公8层2号17室（自贸区武汉片区）</p>
        </div>
        <div class="map">
            <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=114.40%2C30.47%2C114.52%2C30.54&amp;layer=mapnik&amp;marker=30.5063%2C114.4603" loading="lazy" title="BioQuanti 地图"></iframe>
        </div>
    </div>

    <!-- 留言表单 -->
    <form class="bq2-cform" id="bq-contact-form">
        <div class="grid4">
            <input type="text" name="company" maxlength="150" placeholder="公司名称">
            <input type="text" name="name" required maxlength="100" placeholder="您的姓名">
            <input type="text" name="phone" id="bq-phone" maxlength="50" placeholder="联系电话">
            <input type="email" name="email" maxlength="150" placeholder="Email">
        </div>
        <textarea name="content" required rows="8" placeholder="您需要咨询留言的内容"></textarea>
        <div class="sub"><button type="submit">提交信息</button></div>
        <div class="bq2-cform-msg" id="bq-cform-msg"></div>
    </form>
</div>

<#include "/cn/footer.htm"/>

<script>
(function(){
  var form = document.getElementById('bq-contact-form');
  if(!form) return;
  var msg = document.getElementById('bq-cform-msg');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    msg.className = 'bq2-cform-msg';
    msg.innerHTML = '';
    var data = {
      company: form.querySelector('[name=company]').value.trim(),
      name: form.querySelector('[name=name]').value.trim(),
      phone: form.querySelector('[name=phone]').value.trim(),
      email: form.querySelector('[name=email]').value.trim(),
      content: form.querySelector('[name=content]').value.trim()
    };
    if(!data.phone && !data.email){
      msg.className = 'bq2-cform-msg err';
      msg.innerHTML = '请至少填写一种联系方式（电话或 Email）';
      return;
    }
    $.ajax({
      url: '{ms:global.contextpath/}/cms/message/post.do',
      type: 'POST',
      data: JSON.stringify(data),
      contentType: 'application/json',
      dataType: 'json',
      success: function(res){
        if(res && res.result){
          msg.className = 'bq2-cform-msg ok';
          msg.innerHTML = '✓ 提交成功，我们将在工作时间尽快与您联系！';
          form.reset();
        }else{
          msg.className = 'bq2-cform-msg err';
          msg.innerHTML = (res && res.msg) ? res.msg : '提交失败，请稍后重试';
        }
      },
      error: function(){
        msg.className = 'bq2-cform-msg err';
        msg.innerHTML = '网络异常，请稍后重试';
      }
    });
  });
})();
</script>
</body>
</html>
