<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{ms:global.name/}-${field.title}</title>
<meta name="keywords" content="${field.keyword}">
<meta name="description" content="${field.descrip}">
<link rel="alternate" hreflang="zh-CN" href="{ms:global.host/}cn/index.html">
<link rel="alternate" hreflang="en" href="{ms:global.host/}en/index.html">
<link rel="alternate" hreflang="x-default" href="{ms:global.host/}cn/index.html">
<link rel="stylesheet" href="${base}/{ms:global.style/}en/css/app.css">
</head>
<body>
<#include "/en/header.htm"/>

<div class="bq-pagebanner" style="background-image:url('${(field.categoryImg)!"/{ms:global.style/}en/images/hexinjishu.jpg"}')">
    <h1>${field.typetitle}</h1>
    <p>TECHNICAL</p>
</div>

<div class="bq-container bq-detail">
    <div class="bq-crumb" style="background:none;border:0;">Home: <a href="{ms:global.html/}en/index.html">Home</a> &gt; <a href="{ms:global.html/}${field.typelink}">${field.typetitle}</a> &gt; ${field.title}</div>
    <h1 class="title">${field.title}</h1>
    <div class="meta">Published: ${field.date?string("yyyy-MM-dd")}　|　Hits: ${field.hit}</div>
    <div class="content">${field.content}</div>
</div>

<#include "/en/footer.htm"/>
</body>
</html>
